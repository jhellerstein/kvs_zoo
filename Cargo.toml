[package]
name = "kvs_zoo"
publish = false
version = "0.0.0"
edition = "2024"

[lib]
name = "kvs_zoo"

[dependencies]
dfir_rs = { git = "https://github.com/hydro-project/hydro.git", branch = "coord-criterion" }
hydro_lang = { git = "https://github.com/hydro-project/hydro.git", branch = "coord-criterion", features = ["deploy"] }
hydro_std = { git = "https://github.com/hydro-project/hydro.git", branch = "coord-criterion" }
hydro_deploy = { git = "https://github.com/hydro-project/hydro.git", branch = "coord-criterion" }
lattices = { git = "https://github.com/hydro-project/hydro.git", package = "lattices", branch = "coord-criterion", features = ["serde"] }
stageleft = "0.13.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8.0"
futures = "0.3.0"
tokio = { version = "1.29.0", features = ["full"] }
ctor = "0.2"

[features]
# Default: simple HashSet tombstones (no extra dependencies)
default = ["tombstone_hashset"]
# Use a HashSet<String> as the tombstone set
tombstone_hashset = []
# Placeholder for future FST-based tombstones (String keys); currently maps to HashSet in code.
tombstone_fst = []

[build-dependencies]
stageleft_tool = "0.13.2"

[dev-dependencies]
hydro_deploy = { git = "https://github.com/hydro-project/hydro.git", branch = "coord-criterion" }
hydro_lang = { git = "https://github.com/hydro-project/hydro.git", branch = "coord-criterion", features = [
    "deploy",
    "viz",
    "sim",
] }
tokio = { version = "1.29.0", features = ["full"] }
tokio-stream = { version = "0.1.3", default-features = false }
futures = "0.3.0"
insta = { version = "1", features = ["json"] }
proptest = "1.4"
serial_test = "2.0"
clap = { version = "4.5", features = ["derive"] }
trybuild = "1.0"

[lints.clippy]
uninlined_format_args = "allow"

[workspace]
