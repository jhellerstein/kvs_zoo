name: CI

on:
  push:
    branches: [main, master, feat/**, fix/**]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            kvs_zoo

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Build (kvs_zoo)
        run: cargo build --locked --examples --tests

      - name: Clippy (kvs_zoo)
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run unit tests (kvs_zoo)
        run: cargo nextest run --locked --nocapture

      - name: Run smoke tests (ignored)
        run: cargo nextest run --locked --test examples_smoke --run-ignored ignored-only --nocapture

